# Example Lovelace configuration for plant-card.

type: custom:plant-card
name: Monstera
icon: mdi:sprout
image: /local/plants/monstera.jpg        # optional, replaces the icon

last_watered: input_datetime.monstera_last_watered
last_fertilized: input_datetime.monstera_last_fertilized

water_interval: 7                         # days until watering is "overdue"
fertilize_interval: 30

temperature: sensor.monstera_temperature  # every sensor below is optional
humidity: sensor.monstera_humidity
illuminance: sensor.monstera_illuminance
moisture: sensor.monstera_soil_moisture

---
# Several plants side by side.
type: grid
columns: 2
square: false
cards:
  - type: custom:plant-card
    name: Monstera
    last_watered: input_datetime.monstera_last_watered
    last_fertilized: input_datetime.monstera_last_fertilized
    temperature: sensor.monstera_temperature
    humidity: sensor.monstera_humidity
    illuminance: sensor.monstera_illuminance
  - type: custom:plant-card
    name: Ficus
    icon: mdi:tree
    last_watered: input_datetime.ficus_last_watered
    last_fertilized: input_datetime.ficus_last_fertilized
    water_interval: 10
    fertilize_interval: 45
