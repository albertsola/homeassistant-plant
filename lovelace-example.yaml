# With the Plant Care integration installed, one line is enough — the card
# reads the plant's name, timestamps, intervals and sensors from the summary
# entity the integration creates.

type: custom:plant-card
entity: sensor.monstera_plant

---
# Anything you set explicitly still wins over the integration's values.
type: custom:plant-card
entity: sensor.monstera_plant
name: Monstera deliciosa
image: /local/plants/monstera.jpg
water_interval: 5
confirm: false

---
# Several plants side by side.
type: grid
columns: 2
square: false
cards:
  - type: custom:plant-card
    entity: sensor.monstera_plant
  - type: custom:plant-card
    entity: sensor.ficus_plant

---
# Without the integration: point the card at your own helpers and sensors.
type: custom:plant-card
name: Monstera
last_watered: input_datetime.monstera_last_watered
last_fertilized: input_datetime.monstera_last_fertilized
water_interval: 7
fertilize_interval: 30
temperature: sensor.monstera_temperature
humidity: sensor.monstera_humidity
illuminance: sensor.monstera_illuminance
moisture: sensor.monstera_soil_moisture
