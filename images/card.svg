<svg xmlns="http://www.w3.org/2000/svg" width="460" height="272" viewBox="0 0 460 272" role="img" aria-label="plant-card showing a Monstera that was watered 5 days ago and fertilized 34 days ago, with temperature, humidity and light sensors">
  <defs>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .ok  { fill: #43a047; }
      .bad { fill: #e53935; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="460" height="272" rx="0" fill="#f4f5f7"/>
  <rect x="16" y="16" width="428" height="240" rx="12" fill="#ffffff" filter="url(#shadow)"/>

  <!-- header -->
  <circle cx="58" cy="60" r="22" fill="#e8f3e9"/>
  <g transform="translate(48,50)" fill="#43a047">
    <rect x="9.2" y="4" width="1.6" height="13" rx="0.8"/>
    <path d="M10 12 C6.6 12 4.4 9.6 4.4 6.2 C7.8 6.2 10 8.6 10 12 Z"/>
    <path d="M10 10.5 C13.4 10.5 15.6 8.1 15.6 4.7 C12.2 4.7 10 7.1 10 10.5 Z"/>
  </g>
  <text class="t" x="92" y="56" font-size="18" font-weight="500" fill="#212121">Monstera</text>
  <text class="t" x="92" y="74" font-size="12.5" fill="#727272">Needs fertilizer</text>

  <!-- watered row -->
  <g transform="translate(38,108)" fill="#43a047">
    <path d="M8 0 C8 0 2.4 6.6 2.4 10.2 A5.6 5.6 0 0 0 13.6 10.2 C13.6 6.6 8 0 8 0 Z"/>
  </g>
  <text class="t" x="70" y="122" font-size="14.5" fill="#212121">Watered</text>
  <text class="t ok" x="422" y="122" font-size="14.5" font-weight="500" text-anchor="end">5 days ago</text>
  <rect x="70" y="132" width="352" height="4" rx="2" fill="#e4e4e4"/>
  <rect x="70" y="132" width="251" height="4" rx="2" fill="#43a047"/>

  <!-- fertilized row -->
  <g transform="translate(38,162)">
    <path d="M2 16 Q5.5 5.5 16 2 Q12.5 12.5 2 16 Z" fill="#e53935"/>
    <path d="M3.5 14.5 L13.2 4.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <text class="t" x="70" y="176" font-size="14.5" fill="#212121">Fertilized</text>
  <text class="t bad" x="422" y="176" font-size="14.5" font-weight="500" text-anchor="end">34 days ago</text>
  <rect x="70" y="186" width="352" height="4" rx="2" fill="#e4e4e4"/>
  <rect x="70" y="186" width="352" height="4" rx="2" fill="#e53935"/>

  <!-- sensors -->
  <line x1="38" y1="212" x2="422" y2="212" stroke="#e8e8e8" stroke-width="1"/>
  <g fill="#8b8b8b">
    <g transform="translate(38,228)">
      <rect x="5.5" y="1" width="3.4" height="8" rx="1.7"/>
      <circle cx="7.2" cy="11.6" r="3.4"/>
    </g>
    <g transform="translate(160,228)">
      <path d="M7 0 C7 0 2.1 5.8 2.1 9 A4.9 4.9 0 0 0 11.9 9 C11.9 5.8 7 0 7 0 Z"/>
    </g>
    <g transform="translate(286,228)">
      <circle cx="7" cy="7.5" r="4"/>
      <g stroke="#8b8b8b" stroke-width="1.4" stroke-linecap="round">
        <line x1="7" y1="0" x2="7" y2="1.6"/><line x1="7" y1="13.4" x2="7" y2="15"/>
        <line x1="0" y1="7.5" x2="1.6" y2="7.5"/><line x1="12.4" y1="7.5" x2="14" y2="7.5"/>
        <line x1="2.1" y1="2.6" x2="3.2" y2="3.7"/><line x1="10.8" y1="11.3" x2="11.9" y2="12.4"/>
        <line x1="11.9" y1="2.6" x2="10.8" y2="3.7"/><line x1="3.2" y1="11.3" x2="2.1" y2="12.4"/>
      </g>
    </g>
  </g>
  <text class="t" x="60" y="240" font-size="13.5" fill="#212121">21.4 °C</text>
  <text class="t" x="180" y="240" font-size="13.5" fill="#212121">48 %</text>
  <text class="t" x="308" y="240" font-size="13.5" fill="#212121">1240 lx</text>
</svg>
